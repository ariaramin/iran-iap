name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      
      - name: Setup Flutter
        uses: subosito/flutter-action@6128220b25e791206f65839958019e0788647007 # v2.16.0
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
          
      - name: Resolve dependencies
        run: flutter pub get
        
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
        
      - name: Analyze
        run: flutter analyze
        
      - name: Generate API documentation
        run: dart doc --output=doc/api
        
      - name: Test Dart API - Bazaar build contract
        run: flutter test --dart-define=IRAN_IAP_STORE=bazaar
        
      - name: Test Dart API - Myket build contract
        run: flutter test --dart-define=IRAN_IAP_STORE=myket
        
      - name: Check source isolation
        run: python3 tool/check_isolation.py
        
      - name: Test artifact scanner
        run: python3 -m unittest tool.test_verify_android_artifact
        
      - name: Publish dry run
        run: flutter pub publish --dry-run

  android-bazaar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        
      - name: Setup Flutter
        uses: subosito/flutter-action@6128220b25e791206f65839958019e0788647007 # v2.16.0
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
          
      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get
        
      - name: Build Bazaar example
        working-directory: example
        run: flutter build apk --debug --dart-define=IRAN_IAP_STORE=bazaar
        
      - name: Verify Bazaar artifact isolation
        run: >-
          python3 tool/verify_android_artifact.py --store bazaar
          example/build/app/outputs/flutter-apk/app-debug.apk

  android-myket:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        
      - name: Setup Flutter
        uses: subosito/flutter-action@6128220b25e791206f65839958019e0788647007 # v2.16.0
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
          
      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get
        
      - name: Build Myket example
        working-directory: example
        run: flutter build apk --debug --dart-define=IRAN_IAP_STORE=myket
        
      - name: Verify Myket artifact isolation
        run: >-
          python3 tool/verify_android_artifact.py --store myket
          example/build/app/outputs/flutter-apk/app-debug.apk
