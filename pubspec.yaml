name: iran_iap
description: Build-time isolated in-app purchases for Cafe Bazaar and Myket stores. One stable Flutter dependency with zero-overhead native store SDK isolation.
version: 0.3.1
homepage: https://github.com/ariaramin/iran-iap
repository: https://github.com/ariaramin/iran-iap
issue_tracker: https://github.com/ariaramin/iran-iap/issues

topics:
  - in-app-purchase
  - billing
  - cafe-bazaar
  - myket
  - iran

platforms:
  android:

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  args: ^2.7.0
  flutter:
    sdk: flutter
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ">=10.3.0 <12.0.0"

flutter:
  plugin:
    platforms:
      android:
        package: dev.iraniap
        pluginClass: IranIapPlugin

executables:
  iran_iap:
